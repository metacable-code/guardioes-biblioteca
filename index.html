<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guardiões da Biblioteca</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f19;--painel:#1d1828;--borda:#3a2f52;--ouro:#f2b84b;--texto:#efe4cc;--suave:#b8aec8;--verde:#6fcf8f;--azul:#7fb0f5;--vermelho:#e2574c;--roxo:#b07cf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--texto);font-family:'Alegreya Sans',sans-serif;overflow:hidden}
.px{font-family:'Press Start 2P',monospace}
.pix{image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
#topo{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
#topo .nome{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:var(--painel);border:2px solid var(--borda);font-size:14px;font-weight:700;white-space:nowrap}
#ecras{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 14px}
.ecra{display:none}.ecra.on{display:block}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:#1a1524;border-top:2px solid var(--borda)}
#nav button{background:none;border:none;padding:10px 0 12px;font-size:12px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
#nav button.on{color:var(--ouro)}
.cartao{background:var(--painel);border:2px solid var(--borda);border-radius:8px;padding:12px;margin-bottom:12px}
.titulo{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:1px;color:var(--suave);margin:14px 0 8px}
.barra{height:10px;background:#2c2440;border:2px solid #000}.barra>i{display:block;height:100%;transition:width .4s steps(6)}
.grelha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.attr{background:#17131f;border-radius:6px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between}
.attr b{color:var(--ouro)}
.slot{display:flex;align-items:center;gap:10px;background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:8px 10px;min-height:52px}
.r-comum{border-color:#8a8f99!important}.r-incomum{border-color:#5fb27a!important}.r-raro{border-color:#5a8fe0!important}.r-epico{border-color:#a066e0!important}.r-lendario{border-color:#f0a030!important}
.t-comum{color:#b4bcc6}.t-incomum{color:#8fd6a8}.t-raro{color:#7fb0f5}.t-epico{color:#c9a6f7}.t-lendario{color:#f6b25e}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.item small{color:var(--suave);font-size:13px}
.bt{border:3px solid #000;border-radius:4px;padding:0 12px;min-height:44px;font-family:'Press Start 2P',monospace;font-size:10px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35)}
.bt.ouro{background:#e0b860;color:#1a1408}.bt.roxo{background:#7b52b5;color:#fff}.bt.azul{background:#4f7fbf;color:#fff}.bt.cinza{background:#3a2f52;color:#efe4cc}.bt.verm{background:#c4433a;color:#fff}
.bt:disabled{opacity:.45}
/* mapa */
#mapaBox{position:relative;height:560px;border:3px solid var(--borda);border-radius:6px;overflow:hidden;background:#1a1528}
#mapaBox>img.fundo{position:absolute;left:50%;top:0;width:360px;height:600px;transform:translateX(-50%)}
.no{position:absolute;width:56px;height:56px;border:none;padding:0;background:url(assets/nodes.png) no-repeat;background-size:336px 56px;image-rendering:pixelated}
.no.boss{width:78px;height:78px;background:url(assets/boss_node.png) no-repeat;background-size:78px 78px}
.no.bloq{filter:grayscale(.75) brightness(.5)}
.no.feito{filter:brightness(.6) saturate(.5)}
.no.pronto{animation:pronto 1s steps(4) infinite}
@keyframes pronto{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 0 #f6c453)}50%{transform:translateY(-4px);filter:drop-shadow(0 0 7px #f6c453)}}
.ponto{position:absolute;width:6px;height:6px;box-shadow:1px 1px 0 #000;pointer-events:none}
#heroi{position:absolute;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;animation:hbob 1s steps(2) infinite;transition:left .45s steps(9),top .45s steps(9);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
@keyframes hbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(8,6,12,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal.on{display:flex}
#modal .caixa{width:100%;max-width:420px;background:#17131f;border:3px solid var(--ouro);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.6;color:var(--ouro)}
/* combate */
#combate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10;max-width:520px;margin:0 auto}
#combate.on{display:flex}
#palco{position:relative;margin:10px 12px 0;height:340px;border:3px solid var(--borda);border-radius:6px;overflow:hidden;background:#17132a}
#palco .fundo{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:brightness(.36) saturate(.8) blur(1.5px)}
#monWrap{position:absolute;right:12px;top:30px;width:190px;height:180px;display:flex;align-items:flex-end;justify-content:center}
#mon{image-rendering:pixelated;transform-origin:50% 100%;animation:mbob 1.2s steps(4) infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mimicsheet{width:112px;height:104px;background:url(assets/mimic.png) no-repeat;background-size:560px 104px;animation:msheet .9s steps(4) infinite!important}
@keyframes msheet{from{background-position:0 0}to{background-position:-448px 0}}
#heroC{position:absolute;left:18px;bottom:20px;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;animation:hbob 1.2s steps(2) infinite}
.hp{position:absolute;padding:7px;border:3px solid #efe4cc;border-radius:4px;background:rgba(18,15,25,.9);font-size:9px;display:flex;flex-direction:column;gap:5px}
.pop{position:absolute;font-family:'Press Start 2P',monospace;text-shadow:2px 2px 0 #000;pointer-events:none;animation:pop 1s steps(8) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:translateY(-6px)}70%{opacity:1;transform:translateY(-26px)}100%{opacity:0;transform:translateY(-38px)}}
.fx{position:absolute;pointer-events:none;image-rendering:pixelated}
.hit{animation:hit .5s steps(1)}
@keyframes hit{0%,100%{filter:none;transform:translateX(0)}10%{filter:brightness(4)}25%{filter:none;transform:translateX(7px)}40%{filter:brightness(4);transform:translateX(-7px)}55%{filter:none;transform:translateX(3px)}}
.hurt{animation:hurt .6s steps(1)}
@keyframes hurt{0%,100%{opacity:1;transform:translateX(0)}15%{opacity:0;transform:translateX(-6px)}30%{opacity:1;transform:translateX(6px)}45%{opacity:0}60%{opacity:1}75%{opacity:0}}
.dash{animation:dash .55s steps(10)}
@keyframes dash{0%,100%{transform:translate(0,0)}35%,55%{transform:translate(130px,-90px)}}
.lunge{animation:lunge .55s steps(8)}
@keyframes lunge{0%,100%{transform:translate(0,0)}30%,55%{transform:translate(-50px,30px) rotate(-5deg)}}
.glow{animation:glow 1s steps(4)}
@keyframes glow{0%,100%{filter:none}30%,70%{filter:drop-shadow(0 0 8px #7fb0f5) brightness(1.35)}}
.morre{animation:morre 1.2s steps(1) forwards!important}
@keyframes morre{0%,20%,40%,60%{opacity:1}10%,30%,50%,70%,100%{opacity:0}}
#log{margin:10px 12px 0;padding:10px 12px;border:3px solid var(--borda);border-radius:6px;background:#17131f;min-height:74px;font-size:15px;color:#d6cce4}
#acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
#acoes .bt{min-height:54px;font-size:11px}
#erro{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#6e1a12;color:#ffd0c8;padding:10px 14px;border-radius:6px;font-size:14px;display:none;z-index:30;max-width:90%}
#carregar{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:40;text-align:center;padding:24px}


.oo{position:relative;display:inline-block}
.oo i{position:absolute;left:.12em;top:-.38em;width:.76em;height:.26em;background:linear-gradient(currentColor,currentColor) 0 .11em/.24em .15em no-repeat,linear-gradient(currentColor,currentColor) .26em 0/.24em .15em no-repeat,linear-gradient(currentColor,currentColor) .52em .11em/.24em .15em no-repeat}

/* sala de leitura */
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.lstats div{background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;color:var(--suave)}
.lstats b{display:block;font-size:17px;color:var(--ouro)}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.subtabs button{background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:10px;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--suave)}
.subtabs button.on{border-color:var(--ouro);color:var(--ouro)}
.modos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.modos button{background:#17131f;border:2px solid var(--borda);border-radius:20px;padding:7px 11px;font-size:14px;font-weight:700;color:var(--texto)}
.modos button.on{background:#3b2a12;border-color:var(--ouro);color:var(--ouro)}
.qcard{background:var(--painel);border:2px solid var(--borda);border-radius:8px;padding:14px;margin-bottom:12px}
.qcard .qm{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--roxo);margin-bottom:10px;letter-spacing:1px}
.qcard .qt{font-size:17px;line-height:1.4;white-space:pre-wrap;margin-bottom:12px}
.capaq{position:relative;width:min(100%,260px);margin:0 auto 12px;border:3px solid #000;border-radius:4px;overflow:hidden;background:#000;aspect-ratio:2/3}
.capaq img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.capaq img.final{image-rendering:auto}
.fase{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--ouro);margin:-4px 0 6px}
.fasebar{height:8px;background:#2c2440;border:2px solid #000;margin-bottom:12px}.fasebar>i{display:block;height:100%;background:var(--ouro);transition:width .25s linear}
.op{display:block;width:100%;text-align:left;background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:12px;margin-bottom:8px;font-size:16px;font-weight:700;color:var(--texto);min-height:48px}
.op:disabled{opacity:1}
.op.certa{border-color:var(--verde);background:#16301f}.op.errada{border-color:var(--vermelho);background:#3a1714}
.fb{border-radius:6px;padding:12px;margin-bottom:10px;font-size:15px;line-height:1.4}
.fb.ok{background:#16301f;border:2px solid var(--verde)}.fb.nok{background:#3a1714;border:2px solid var(--vermelho)}
.fb .rw{margin-top:8px;font-weight:800;color:var(--ouro)}
.cromomini{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px;background:rgba(0,0,0,.25);border-radius:6px}
.cromomini img,.cromomini .ph{width:42px;height:63px;object-fit:cover;border:2px solid #000;border-radius:3px;flex:none}
.series{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.serie{background:#17131f;border:2px solid var(--borda);border-radius:6px;padding:8px 10px;font-size:14px}
.serie .barra{margin-top:6px;height:8px}
.cromos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cromo{background:#17131f;border:2px solid var(--borda);border-radius:6px;overflow:hidden;position:relative}
.cromo img,.cromo .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:11px;font-weight:800;color:#efe4cc;background:linear-gradient(160deg,#3a2f52,#1d1828)}
.cromo .ct{padding:5px 6px;font-size:11.5px;font-weight:700;line-height:1.2;height:36px;overflow:hidden}
.cromo .vz{position:absolute;right:4px;top:4px;background:var(--ouro);color:#1a1408;font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 4px;border-radius:3px;border:2px solid #000}
/* ecrã inicial */
#inicio{position:fixed;inset:0;z-index:36;display:none;flex-direction:column;max-width:520px;margin:0 auto;background:#0d0a14;overflow:hidden}
#inicio.on{display:flex}
#inicio .bg{position:absolute;inset:-14px;background:url(assets/fundo_espectro.jpg) center/cover;filter:brightness(.38) saturate(.9) blur(2px)}
#inicio .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(120,70,190,.28),transparent 62%),linear-gradient(to bottom,rgba(13,10,20,.55),transparent 30%,rgba(13,10,20,.92) 100%)}
#inicio .tit{position:relative;z-index:2;text-align:center;padding:7vh 12px 0;font-family:'Press Start 2P',monospace}
#inicio .tit .a{display:block;font-size:clamp(22px,7.4vw,34px);line-height:1.25;color:#f6c453;text-shadow:0 3px 0 #7a4a10,0 6px 0 #000,0 0 22px rgba(246,196,83,.55);letter-spacing:1px}
#inicio .tit .b{display:block;margin-top:12px;font-size:clamp(11px,3.5vw,15px);color:#efe4cc;text-shadow:3px 3px 0 #000;letter-spacing:2px}
#inicio .tit .c{display:block;margin-top:14px;font-size:8px;color:#b8aec8;text-shadow:2px 2px 0 #000;letter-spacing:1px;line-height:1.8}
#inicio .cena{position:relative;z-index:1;flex:1;min-height:0}
#inicio .cena img{position:absolute;image-rendering:pixelated}
#inicio .cena .rei{left:50%;bottom:20%;width:min(60%,300px);transform:translateX(-50%);filter:brightness(.5) saturate(.8) drop-shadow(0 0 18px rgba(176,124,240,.65));animation:reiBob 3s steps(6) infinite}
@keyframes reiBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
#inicio .cena .pb{left:1%;bottom:3%;height:min(46%,310px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));animation:hbob 1.4s steps(2) infinite}
#inicio .cena .pl{right:4%;bottom:3%;height:min(46%,310px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));animation:hbob 1.4s .35s steps(2) infinite}
#inicio .cena::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(to top,#0d0a14,transparent)}
#inicio .vp{position:absolute;z-index:1;width:4px;height:4px;background:#ffd25e;box-shadow:0 0 6px #ffd25e;opacity:0;animation:vsobe linear infinite}
@keyframes vsobe{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-60vh)}}
#inicio .menu{position:relative;z-index:2;padding:6px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#inicio .menu .bt{min-height:52px;font-size:11px;display:flex;align-items:center;justify-content:center;gap:10px}
#inicio .menu .bt:disabled{opacity:1;background:#2a2238;color:#7d7390;border-color:#14101c}
#inicio .quem{text-align:center;font-size:14px;color:var(--suave);min-height:18px;text-shadow:1px 1px 0 #000}
#inicio .ver{position:absolute;right:10px;top:8px;z-index:3;font-family:'Press Start 2P',monospace;font-size:7px;color:#6d6382}
#btInicio{cursor:pointer;padding:4px 9px}

/* escolha de personagem */
#escolha{position:fixed;inset:0;z-index:37;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto;padding:14px 12px 12px;gap:10px}
#escolha.on{display:flex}
#escolha h1{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--ouro);text-align:center;line-height:1.8;margin:6px 0 0;font-weight:400}
#escolha .sub{text-align:center;color:var(--suave);font-size:14px;margin-top:-4px}
#cartas{flex:1;min-height:0;display:flex;gap:10px}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;padding:0;border:3px solid var(--borda);border-radius:8px;overflow:hidden;background:#17131f;text-align:left;filter:brightness(.6) saturate(.8);transition:transform .15s,filter .2s,border-color .15s}
.pc.sel{border-color:var(--ouro);filter:none;transform:translateY(-4px);box-shadow:0 0 0 2px #000,0 0 20px rgba(242,184,75,.55)}
.pc .arte{position:relative;flex:1;min-height:0;background-size:cover;background-position:center 25%}
.pc .spr{position:absolute;left:6px;bottom:6px;width:74px;height:84px;border:3px solid #000;border-radius:4px;background:rgba(18,15,25,.82);display:flex;align-items:flex-end;justify-content:center;padding:3px;box-shadow:inset 0 0 0 2px var(--borda)}
.pc .spr img{max-width:100%;max-height:100%;image-rendering:pixelated}
.pc .info{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;background:linear-gradient(#1d1828,#17131f)}
.pc .info b{font-size:16px;line-height:1.15;color:var(--texto)}
.pc .info small{font-size:13px;color:var(--suave);line-height:1.25}
.pc .info .tag{align-self:flex-start;font-family:'Press Start 2P',monospace;font-size:8px;padding:4px 6px;border-radius:3px;background:#2c2440;color:var(--ouro);border:2px solid #000}
.banner{position:relative;height:150px;border:2px solid var(--borda);border-radius:8px;overflow:hidden;background-size:cover;background-position:center 22%;margin-bottom:12px}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(14,10,22,.9),transparent 55%)}
.banner .spr{position:absolute;left:8px;bottom:8px;z-index:1;width:56px;height:64px;border:3px solid #000;border-radius:4px;background:rgba(18,15,25,.82);display:flex;align-items:flex-end;justify-content:center;padding:2px}
.banner .spr img{max-width:100%;max-height:100%;image-rendering:pixelated}
.banner .bn{position:absolute;right:10px;bottom:8px;z-index:1;text-align:right;text-shadow:2px 2px 0 #000;font-weight:800;font-size:17px}
.banner .bn small{display:block;font-weight:500;font-size:13px;color:#d9cdb8}
#cartas .pc.vazio{border-style:dashed;filter:none;opacity:.55;pointer-events:none}#cartas .pc.vazio .arte{background:repeating-linear-gradient(45deg,#1d1828 0 12px,#17131f 12px 24px)}
#pagEsc{display:flex;align-items:center;justify-content:center;gap:14px}
#pagEsc .seta{background:#17131f;border:2px solid var(--borda);border-radius:6px;width:46px;height:38px;color:var(--ouro);font-size:14px}
#pagEsc .seta:disabled{opacity:.3}
#pagEsc .pontos{display:flex;gap:7px}#pagEsc .pontos i{width:9px;height:9px;background:#3a2f52;border:2px solid #000}#pagEsc .pontos i.on{background:var(--ouro)}
#cartas.desl-d{animation:deslD .28s steps(6)}#cartas.desl-e{animation:deslE .28s steps(6)}
@keyframes deslD{from{transform:translateX(40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes deslE{from{transform:translateX(-40px);opacity:.2}to{transform:none;opacity:1}}
/* rodopio + explosão de luz */
#rito{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;perspective:900px;overflow:hidden;background:rgba(6,4,10,0)}
#rito.on{display:flex;animation:ritoBg .45s forwards}
@keyframes ritoBg{to{background:rgba(6,4,10,.95)}}
#rito.fim{animation:fimRito .45s forwards}
@keyframes fimRito{from{opacity:1;background:rgba(6,4,10,.95)}to{opacity:0;background:rgba(6,4,10,.95)}}
#rito .halo{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.6),rgba(255,226,140,0) 66%);opacity:0;transform:scale(.3);animation:halo 1.5s ease-in forwards}
@keyframes halo{to{opacity:.9;transform:scale(1)}}
#rito .raios{position:absolute;width:170vmax;height:170vmax;left:50%;top:50%;margin:-85vmax 0 0 -85vmax;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,232,150,0) 0 7deg,rgba(255,232,150,.7) 7deg 14deg);-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,0) 58%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,0) 58%)}
#rito.burst .raios{animation:raios 1.9s ease-out forwards}
@keyframes raios{0%{opacity:0;transform:rotate(0) scale(.1)}15%{opacity:1}100%{opacity:0;transform:rotate(70deg) scale(1)}}
#rito .anel{position:absolute;width:20vmin;height:20vmin;border:6px solid #fff3c0;border-radius:50%;opacity:0}
#rito.burst .anel{animation:anel 1.1s ease-out forwards}
@keyframes anel{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(8)}}
#rito .fig{position:relative;height:min(46vh,360px);image-rendering:pixelated;transform:rotateY(0) scale(.5);filter:brightness(.6);animation:rodopio 1.5s steps(30) forwards}
@keyframes rodopio{from{transform:rotateY(0) scale(.5);filter:brightness(.6)}to{transform:rotateY(1080deg) scale(1);filter:brightness(1)}}
#rito.burst .fig{animation:brilho .9s steps(9) forwards;transform:rotateY(0) scale(1);filter:none}
@keyframes brilho{0%{filter:brightness(4) drop-shadow(0 0 28px #fff)}100%{filter:brightness(1) drop-shadow(0 0 10px rgba(255,226,140,.8))}}
#rito .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#rito.burst .flash{animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
#rito .bemv{position:absolute;left:0;right:0;bottom:11vh;text-align:center;font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.9;color:var(--ouro);text-shadow:3px 3px 0 #000;opacity:0;padding:0 16px}
#rito.burst .bemv{animation:subir .9s .5s ease-out forwards}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#rito .fa{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;opacity:0}
#rito.burst .fa{animation:faisca 1.2s ease-out forwards}
@keyframes faisca{0%{opacity:1;transform:translate(0,0) scale(1.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
</style>
</head>
<body>
<div id="carregar"><div class="px" style="color:var(--ouro);font-size:14px;line-height:1.8">GUARDI<span class="oo">O<i></i></span>ES<br>DA BIBLIOTECA</div><div id="carregarMsg" style="color:var(--suave)">A abrir a biblioteca…</div></div>

<div id="app">
  <div id="topo">
    <div style="display:flex;align-items:center;gap:8px;min-width:0"><button class="chip" id="btInicio" aria-label="Menu inicial">☰</button><div class="nome" id="tNome">—</div></div>
    <div style="display:flex;gap:6px">
      <span class="chip" title="Velas"><img src="assets/vela.png" class="pix" width="10" height="14" alt=""> <span id="tVelas">0</span></span>
      <span class="chip" title="Moedas" style="color:var(--ouro)">● <span id="tMoedas">0</span></span>
    </div>
  </div>
  <div id="ecras">
    <section class="ecra on" id="e-perfil"></section>
    <section class="ecra" id="e-mapa"></section>
    <section class="ecra" id="e-mochila"></section>
    <section class="ecra" id="e-ranking"></section>
    <section class="ecra" id="e-leitura"></section>
  </div>
  <nav id="nav">
    <button data-e="perfil" class="on">◆<span>Perfil</span></button>
    <button data-e="mapa">✦<span>Mapa</span></button>
    <button data-e="leitura">📖<span>Leitura</span></button>

</div>

<div id="combate">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0">
    <span class="px" style="font-size:10px;color:#e07a6a" id="cTitulo">COMBATE</span>

  </div>
  <div id="palco">
    <img class="fundo" id="cFundo" alt="">
    <div id="monWrap"><div id="mon"></div></div>
    <div id="heroC"></div>
    <div class="hp" style="left:8px;top:8px;width:160px"><div style="display:flex;justify-content:space-between" class="px"><span id="cMonNome">—</span><span id="cMonNv" style="color:var(--azul)"></span></div><div class="barra"><i id="cMonHp" style="background:var(--vermelho);width:100%"></i></div><span class="px" style="color:#c9b08a;font-size:8px" id="cMonTxt"></span></div>
    <div class="hp" style="right:8px;bottom:8px;width:170px"><div class="px">TU</div><div class="barra"><i id="cJHp" style="background:var(--verde);width:100%"></i></div><div class="barra" style="height:7px"><i id="cJTinta" style="background:var(--azul);width:100%"></i></div><span class="px" style="color:#c9b08a;font-size:8px" id="cJTxt"></span></div>
  </div>
  <div id="log"></div>
  <div id="acoes">
    <button class="bt ouro" data-a="ataque">ATACAR</button>
    <button class="bt roxo" data-a="feitico">FEITIÇO · 25</button>
    <button class="bt azul" data-a="defender">DEFENDER</button>
    <button class="bt cinza" data-a="fugir">FUGIR</button>
  </div>
</div>

<div id="inicio">
  <div class="bg"></div><span class="ver">v0.3</span>
  <div class="tit"><span class="a">GUARDI<span class="oo">O<i></i></span>ES</span><span class="b">DA BIBLIOTECA</span><span class="c">EXPLORA · COMBATE · COLECIONA</span></div>
  <div class="cena"><img class="rei" src="assets/rei.png" alt=""><img class="pb" src="assets/p_bruxa.png" alt=""><img class="pl" src="assets/p_leitora.png" alt=""></div>
  <div class="menu">
    <div class="quem" id="iQuem"></div>
    <button class="bt ouro" id="btJogar">▶ JOGAR</button>
    <button class="bt azul" id="btLeitura">📖 SALA DE LEITURA</button>
    <button class="bt roxo" id="btPers">ESCOLHER PERSONAGEM</button>
  </div>
</div>
<div id="escolha">
  <h1>ESCOLHE A TUA<br>GUARDIÃ</h1>
  <div class="sub">Toca numa personagem · desliza para ver mais.</div>
  <div id="cartas"></div>
  <div id="pagEsc" class="pagesc"></div>
  <div style="display:flex;gap:10px"><button class="bt cinza" id="btVoltar" style="min-height:52px;font-size:10px;flex:0 0 34%">◀ VOLTAR</button><button class="bt ouro" id="btEscolher" disabled style="min-height:52px;font-size:11px;flex:1">ESCOLHER</button></div>
</div>
<div id="rito"></div>
<div id="modal"><div class="caixa" id="modalCaixa"></div></div>
<div id="erro"></div>

<script>
/* ====== CONFIG ====== */
const CONFIG = {
  // URL público do servidor do bot (Railway). As rotas ficam em /guardioes/api/…
  apiUrl: 'https://rxbot-production-0047.up.railway.app'
};
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#120f19'); tg.setBackgroundColor('#120f19'); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
const params = new URLSearchParams(location.search);
if (params.get('api')) CONFIG.apiUrl = params.get('api');
let _hash = ''; try { _hash = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || ''; } catch (e) {}
const initData = (tg && tg.initData) || _hash || params.get('initData') || '';
const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const GEN = { fantasia: 'Fantasia', terror: 'Terror', romance: 'Romance', policial: 'Policial', fc: 'Ficção Científica', aventura: 'Aventura', dark: 'Dark Romance', spicy: 'Spicy' };
const RAR = { comum: 'Comum', incomum: 'Incomum', raro: 'Raro', epico: 'Épico', lendario: 'Lendário' };
const SLOT = { arma: 'Arma', escudo: 'Escudo', capa: 'Capa', anel: 'Anel', reliquia: 'Relíquia' };
const ATTR = { atq: 'Ataque', def: 'Defesa', prec: 'Precisão', esq: 'Esquiva', crit: 'Crítico', contra: 'Contra-ataque', vida: 'Vida', tinta: 'Tinta' };
let P = null, ecraAtual = 'perfil', ocupado = false;
const PERS = {
  bruxa: { nome: 'A Bruxa Arquivista', sprite: 'assets/p_bruxa.png', arte: 'assets/arte_bruxa.jpg', w: 204, h: 228, cor: '#c25bff' },
  leitora: { nome: 'A Leitora do Lume', sprite: 'assets/p_leitora.png', arte: 'assets/arte_leitora.jpg', w: 115, h: 226, cor: '#ff9a3c' },
  inspetor: { nome: 'O Inspetor das Margens', sprite: 'assets/p_inspetor.png', arte: 'assets/arte_inspetor.jpg', w: 76, h: 170, cor: '#6fe08f' },
  cartografa: { nome: 'A Cartógrafa Errante', sprite: 'assets/p_cartografa.png', arte: 'assets/arte_cartografa.jpg', w: 103, h: 197, cor: '#ffb347' },
  dama: { nome: 'A Dama das Cartas de Amor', sprite: 'assets/p_dama.png', arte: 'assets/arte_dama.jpg', w: 157, h: 346, cor: '#ff8fb8' },
  herdeira: { nome: 'A Herdeira da Ribeira', sprite: 'assets/p_herdeira.png', arte: 'assets/arte_herdeira.jpg', w: 155, h: 328, cor: '#d4294a' },
  detetive: { nome: 'A Detetive da Chuva', sprite: 'assets/p_detetive.png', arte: 'assets/arte_detetive.jpg', w: 101, h: 246, cor: '#e0435a' }
};
const persAtual = () => PERS[P && P.personagem] || PERS.leitora;
function tamanhoHeroi(h) { const p = persAtual(); return { w: Math.round(h * p.w / p.h), h }; }

/* ====== API ====== */
async function api(acao, dados) {
  const r = await fetch(CONFIG.apiUrl.replace(/\/$/, '') + '/guardioes/api/' + acao, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ initData }, dados || {}))
  });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.erro) || ('Erro ' + r.status));
  if (j.perfil) aplicarPerfil(j.perfil);
  return j;
}
function erro(msg) { const e = $('#erro'); e.textContent = msg; e.style.display = 'block'; clearTimeout(erro.t); erro.t = setTimeout(() => e.style.display = 'none', 3500); }

/* ====== PERFIL ====== */
function fmtAttr(k, v) { return k === 'def' || k === 'crit' ? Math.round(v * 100) + '%' : v; }
function aplicarPerfil(p) {
  P = p;
  $('#tNome').textContent = p.nome; $('#tVelas').textContent = p.velas + '/' + p.velas_max; $('#tMoedas').textContent = p.moedas.toLocaleString('pt-PT');
  desenharPerfil(); desenharMochila(); if (ecraAtual === 'mapa') desenharMapa();
}
function desenharPerfil() {
  const p = P, a = p.atributos, eq = {};
  p.itens.filter(i => i.equipado).forEach(i => eq[i.slot] = i);
  const pct = Math.round(p.xp / p.xp_proximo * 100);
  const vela = p.velas < p.velas_max ? `Próxima vela em ${Math.ceil(p.proxima_vela_s / 60)} min` : 'Velas cheias';
  const pe = PERS[p.personagem];
  const banner = pe ? `<div class="banner" style="background-image:url(${pe.arte})"><div class="spr"><img src="${pe.sprite}" alt=""></div><div class="bn">${pe.nome}<small>Afinidade ${GEN[a.genero] || a.genero}</small></div></div>` : '';
  $('#e-perfil').innerHTML = banner + `
  <div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:20px;font-weight:800">${esc(p.nome)}</div><span class="chip" style="background:var(--ouro);color:#1a1408;border-color:#000">Nv. ${p.nivel}</span></div>
    <div style="margin:10px 0 6px;display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--suave)">Experiência</span><b style="color:var(--ouro)">${p.xp.toLocaleString('pt-PT')} / ${p.xp_proximo.toLocaleString('pt-PT')}</b></div>
    <div class="barra"><i style="width:${pct}%;background:var(--ouro)"></i></div>
    <div style="margin-top:8px;font-size:13px;color:var(--suave)">${vela} · Afinidade: <b style="color:var(--texto)">${GEN[a.genero] || a.genero}</b></div>
  </div>
  <div class="titulo">PERÍCIAS</div>
  <div class="grelha"><div class="attr">⚔️ Combate <b>${p.pericias.combate}/99</b></div><div class="attr" style="opacity:.5">🗡️ Furto <b>em breve</b></div></div>
  <div class="titulo">ATRIBUTOS</div>
  <div class="grelha">${['vida', 'atq', 'def', 'prec', 'crit', 'contra'].map(k => `<div class="attr">${ATTR[k]} <b>${fmtAttr(k, a[k])}</b></div>`).join('')}</div>
  <div class="titulo">EQUIPAMENTO</div>
  <div class="grelha">${Object.keys(SLOT).map(s => { const i = eq[s]; return `<div class="slot ${i ? 'r-' + i.raridade : ''}"><div><div style="font-size:12px;color:var(--suave)">${SLOT[s]}</div><div style="font-weight:700" class="${i ? 't-' + i.raridade : ''}">${i ? esc(i.nome) : '—'}</div></div></div>`; }).join('')}</div>`;
}
function descItem(i) { return Object.entries(i.attrs).map(([k, v]) => `${ATTR[k]} +${fmtAttr(k, v)}`).join(' · '); }
function desenharMochila() {
  const it = P.itens;
  $('#e-mochila').innerHTML = `<div class="titulo">MOCHILA · ${it.length}</div>` + it.map(i => `
    <div class="item r-${i.raridade}">
      <div style="min-width:0"><div style="font-weight:800" class="t-${i.raridade}">${esc(i.nome)}${i.equipado ? ' <small>· equipado</small>' : ''}</div>
      <small>${RAR[i.raridade]} · ${SLOT[i.slot]} · ${GEN[i.genero] || ''}</small><br><small>${descItem(i)}</small></div>
      <div style="display:flex;flex-direction:column;gap:6px">${i.equipado ? '' : `<button class="bt ouro" data-eq="${i.id}">USAR</button><button class="bt cinza" data-vd="${i.id}">${i.venda}●</button>`}</div>
    </div>`).join('');
}
$('#e-mochila').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button'); if (!b || ocupado) return; ocupado = true;
  try { if (b.dataset.eq) { await api('equipar', { item_id: +b.dataset.eq }); haptic('medium'); } else if (b.dataset.vd) { await api('vender', { item_id: +b.dataset.vd }); haptic(); } }
  catch (e) { erro(e.message); } finally { ocupado = false; }
});

/* ====== MAPA ====== */
const ICON = { inicio: 0, combate: 1, elite: 2, tesouro: 3, evento: 4, descanso: 5 };
const W = 340, H = 560;
function posicoes(m) {
  const linhas = {}; m.nos.forEach(n => (linhas[n.linha] = linhas[n.linha] || []).push(n));
  const nl = Object.keys(linhas).length, pos = {};
  Object.values(linhas).forEach(l => l.sort((a, b) => a.col - b.col).forEach((n, i) => {
    pos[n.id] = { x: W * (i + 1) / (l.length + 1), y: H - 45 - (H - 120) * n.linha / (nl - 1) };
  }));
  return pos;
}
function desenharMapa() {
  const m = P.mapa, pos = posicoes(m), atual = m.nos.find(n => n.id === m.atual), prontos = atual ? atual.seguintes : [];
  let html = `<div class="titulo" style="display:flex;justify-content:space-between"><span>${esc(m.nome.toUpperCase())}</span><span>${P.velas} VELAS</span></div><div id="mapaBox"><img class="fundo pix" src="assets/mapa_bg.png" alt="">`;
  const off = 'calc(50% - ' + (W / 2) + 'px)';
  m.nos.forEach(n => n.seguintes.forEach(s => {
    const a = pos[n.id], b = pos[s], dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), passos = Math.floor((len - 70) / 13);
    const andado = m.visitados.includes(n.id) && m.visitados.includes(s), aberto = n.id === m.atual;
    for (let i = 0; i <= passos; i++) { const t = (34 + i * 13) / len; html += `<span class="ponto" style="left:calc(${off} + ${a.x + dx * t - 3}px);top:${a.y + dy * t - 3}px;background:${andado ? '#f6c453' : aberto ? '#fff0a8' : '#4a4060'}"></span>`; }
  }));
  m.nos.forEach(n => {
    const p = pos[n.id], boss = n.tipo === 'boss', t = boss ? 78 : 56;
    let cls = 'bloq'; if (m.feitos.includes(n.id) || (m.visitados.includes(n.id) && n.id !== m.atual)) cls = 'feito'; if (n.id === m.atual) cls = ''; if (prontos.includes(n.id)) cls = 'pronto';
    html += `<button class="no ${boss ? 'boss' : ''} ${cls}" data-no="${n.id}" aria-label="${n.tipo}" style="left:calc(${off} + ${p.x - t / 2}px);top:${p.y - t / 2}px;${boss ? '' : `background-position:${-ICON[n.tipo] * 56}px 0`}"></button>`;
  });
  const pa = pos[m.atual];
  const hs = persAtual(), ht = tamanhoHeroi(76);
  html += `<div id="heroi" style="left:calc(${off} + ${pa.x - ht.w - 12}px);top:${pa.y - ht.h + 20}px;width:${ht.w}px;height:${ht.h}px;background-image:url(${hs.sprite})"></div></div>
  <div class="cartao" style="margin-top:12px;font-size:15px;color:var(--suave)">Toca num nó a brilhar para avançar (1 vela). Os combates, enigmas e tesouros resolvem-se lá.</div>`;
  $('#e-mapa').innerHTML = html;
}
$('#e-mapa').addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-no]'); if (!b || ocupado) return;
  const m = P.mapa, atual = m.nos.find(n => n.id === m.atual);
  if (!atual.seguintes.includes(b.dataset.no)) { const n = m.nos.find(x => x.id === b.dataset.no); erro(n.monstro ? `${n.monstro.nome} · ainda não chegaste aqui.` : 'Ainda não chegaste aqui.'); return; }
  ocupado = true; haptic();
  try {
    const r = await api('avancar', { destino: b.dataset.no });
    if (r.combate) abrirCombate(r.combate);
    else if (r.enigma) mostrarEnigma(r.enigma);
    else if (r.tipo === 'tesouro') modal(`<h3>TESOURO</h3><div>Encontraste <b style="color:var(--ouro)">${r.moedas} moedas</b>${r.item ? ` e <b class="t-${r.item.raridade}">${esc(r.item.nome)}</b> (${RAR[r.item.raridade]})` : ''}.</div>`);
    else if (r.tipo === 'descanso') modal(`<h3>DESCANSO</h3><div>Lês umas páginas à luz da vela e recuperas <b>${r.velas_ganhas} velas</b>.</div>`);
  } catch (e) { erro(e.message); } finally { ocupado = false; }
});
function modal(html, botoes) {
  $('#modalCaixa').innerHTML = html + (botoes || '<button class="bt ouro" data-fechar>CONTINUAR</button>');
  $('#modal').classList.add('on');
}
$('#modal').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.fechar !== undefined) { $('#modal').classList.remove('on'); return; }
  if (b.dataset.resp !== undefined && !ocupado) {
    ocupado = true;
    try {
      const r = await api('responder', { resposta: +b.dataset.resp });
      modal(r.certo ? `<h3>CERTO!</h3><div>+${r.xp} XP e +1 vela.</div>` : `<h3>ERRADO…</h3><div>O pergaminho desfaz-se em pó.</div>`);
      haptic(r.certo ? 'heavy' : 'rigid');
    } catch (e) { erro(e.message); } finally { ocupado = false; }
  }
});
function mostrarEnigma(e) {
  modal(`<h3>ENIGMA</h3><div style="font-size:17px">${esc(e.pergunta)}</div>`, e.respostas.map((t, i) => `<button class="bt cinza" style="font-family:'Alegreya Sans';font-size:16px;font-weight:700;text-align:left" data-resp="${i}">${esc(t)}</button>`).join(''));
}

/* ====== COMBATE ====== */
const SPR = {
  mimico: { cls: 'mimicsheet' }, traca: { cls: 'mimicsheet' },
  espectro: { img: 'assets/espectro.png', w: 112, h: 163, fundo: 'assets/fundo_espectro.jpg' },
  rei: { img: 'assets/rei.png', w: 161, h: 145 }
};
let C = null;
function abrirCombate(c) {
  C = c; const s = SPR[c.inimigo.sprite] || SPR.mimico, mon = $('#mon');
  mon.className = ''; mon.removeAttribute('style'); mon.innerHTML = '';
  if (s.cls) mon.classList.add(s.cls, 'pix'); else mon.innerHTML = `<img src="${s.img}" width="${s.w}" height="${s.h}" class="pix" alt="${esc(c.inimigo.nome)}" style="filter:${c.inimigo.sprite === 'espectro' ? 'drop-shadow(0 0 6px rgba(176,124,240,.6))' : 'none'}">`;
  $('#cFundo').src = s.fundo || 'assets/fundo_mimico.jpg';
  $('#cTitulo').textContent = (c.tipo === 'boss' ? 'BOSS · ' : c.tipo === 'elite' ? 'ELITE · ' : '') + P.mapa.nome.toUpperCase();
  const nm = c.inimigo.nome.toUpperCase(); $('#cMonNome').textContent = nm.length <= 14 ? nm : nm.split(' ').slice(0, 2).join(' ').slice(0, 14); $('#cMonNv').textContent = 'Nv' + c.inimigo.nivel;
  $('#log').innerHTML = esc(c.intro);
  atualizarBarras(c.jogador, c.inimigo.vida, c.inimigo.vida_max); $('#cTurno').textContent = 'TURNO ' + (c.turno + 1);
  const hc = $('#heroC'), ht = tamanhoHeroi(150); hc.style.width = ht.w + 'px'; hc.style.height = ht.h + 'px'; hc.style.backgroundImage = `url(${persAtual().sprite})`;
  $('#combate').classList.add('on'); bloquear(false);
}
function atualizarBarras(j, vi, vmax) {

  if (b.dataset.sub) { L.sub = b.dataset.sub; haptic(); desenharLeitura(); return; }
  if (b.dataset.modo !== undefined) { const m = +b.dataset.modo; if (m !== L.modo) { L.modo = m; haptic(); if (L.q && !L.res) { L.q = null; limparTimers(); } desenharLeitura(); } return; }
  if (b.dataset.l === 'nova') { novaPergunta(); return; }
  if (b.dataset.op !== undefined) responderLeitura(+b.dataset.op);
});

/* ====== RANKING / NAV ====== */
async function desenharRanking() {
  $('#e-ranking').innerHTML = '<div class="titulo">TOP GUARDIÕES</div><div class="cartao">A carregar…</div>';
  try { const r = await api('ranking'); const med = ['🥇', '🥈', '🥉'];
    $('#e-ranking').innerHTML = '<div class="titulo">TOP GUARDIÕES</div>' + r.top.map((x, i) => `<div class="item" style="${x.eu ? 'border-color:var(--ouro)' : ''}"><span>${med[i] || (i + 1) + '.'} <b>${esc(x.nome)}</b></span><span class="chip">Nv. ${x.nivel}</span></div>`).join('');
  } catch (e) { $('#e-ranking').innerHTML = '<div class="cartao">' + esc(e.message) + '</div>'; }
}
function mostrarEcra(n) {
  ecraAtual = n; document.querySelectorAll('.ecra').forEach(e => e.classList.toggle('on', e.id === 'e-' + n));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.e === n));
  if (n === 'mapa') desenharMapa(); if (n === 'ranking') desenharRanking(); if (n === 'leitura') desenharLeitura();
}
$('#nav').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { mostrarEcra(b.dataset.e); haptic(); } });

/* ====== ARRANQUE ====== */
(async function () {
  if (!initData) { $('#carregarMsg').textContent = 'Abre o jogo pelo Telegram, no botão do bot. [diag: script=' + (window.Telegram ? 'sim' : 'não') + ', plataforma=' + (tg && tg.platform) + ', hash=' + location.hash.length + ']'; return; }
  try {
    const nome = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : '';
    const r = await api('perfil', { nome });
    aplicarPerfil(r.perfil || r);
    $('#carregar').style.display = 'none';
    mostrarInicio();
  } catch (e) { $('#carregarMsg').textContent = 'Não consegui ligar ao servidor (' + e.message + ').'; }
})();
</script>
